<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<!-- Catalistics: shared settings (storage, targets, links). Must load before the page scripts. -->
<script src="catalistics-settings.js" onerror="this.remove()"></script>
<script src="catalistics-config.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meters Dashboard · Catalistics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #F2F3F3;
      --card: #FFFFFF;
      --accent: #0972D3;
      --text: #161E2D;
      --text-dim: #545B64;
      --border: #D5DBDB;
      --error: #D13212;
      --success: #067F68;
      --warning: #FF9900;
      --orange: #FF9900;
      --dark-purple: #0972D3;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--cx-font);
      background: #F2F3F3;
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
    }
    aside {
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      background: none;
      -webkit-background-clip: border-box;
      -webkit-text-fill-color: currentColor;
      margin-bottom: 2.5rem;
      text-align: center;
    }
    h2 {
      font-size: 1.1rem;
      color: var(--text-dim);
      margin: 1.8rem 0 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .period-btn, .team-btn, .month-btn {
      display: block;
      width: 100%;
      padding: 0.95rem 1.2rem;
      margin: 0.4rem 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 0.97rem;
    }
    .period-btn:hover, .team-btn:hover, .month-btn:hover {
      background: rgba(9,114,211,0.028);
      border-color: var(--accent);
    }
    .period-btn.active {
      background: var(--accent);
      color: #161E2D;
      border-color: var(--accent);
      box-shadow: 0 1px 2px rgba(0,28,36,0.10);
    }
    .team-btn.active {
      background: #F2F8FD;
      color: #161E2D;
      font-weight: 600;
      border-color: var(--accent);
    }
    .month-btn {
      padding: 0.65rem 1rem;
      font-size: 0.88rem;
    }
    .month-btn.active {
      background: #F0F8F6;
      color: #161E2D;
      font-weight: 600;
      border-color: var(--success);
    }
    .month-btn:hover {
      background: #F0F8F6;
      border-color: var(--success);
    }
    .months-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
    }
    .months-grid .month-btn {
      margin: 0;
      text-align: center;
      padding: 0.55rem 0.4rem;
      font-size: 0.82rem;
    }

    /* ── View Toggle ── */
    .view-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.35rem;
    }
    .view-tab {
      flex: 1;
      padding: 0.7rem 0.5rem;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s ease;
      text-align: center;
      line-height: 1.3;
    }
    .view-tab:hover { color: var(--text); background: rgba(0,28,36,0.04); }
    .view-tab.active {
      background: var(--accent);
      color: #161E2D;
      box-shadow: 0 1px 2px rgba(0,28,36,0.10);
    }
    .view-tab.active.tab-mix   { background: #0972D3; }
    .view-tab.active.tab-types { background: #067F68; }
    .view-tab.active.tab-abort { background: #FF9900; }

    /* headcount badge */
    .headcount-badge {
      display: inline-block;
      background: #F2F8FD;
      border: 1px solid rgba(9,114,211,0.4);
      border-radius: 4px;
      font-size: 0.72rem;
      color: #8456CE;
      padding: 2px 7px;
      margin-left: 6px;
      font-weight: 700;
      vertical-align: middle;
    }

    main {
      padding: 2.5rem 3rem;
      max-width: 1600px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 2rem;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      background: none;
      -webkit-background-clip: border-box;
      -webkit-text-fill-color: currentColor;
    }
    .stats-container {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .stats-box {
      background: linear-gradient(135deg, #F2F8FD, rgba(9,114,211,0.035));
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 1rem 1.5rem;
      box-shadow: 0 1px 2px rgba(0,28,36,0.10);
      min-width: 130px;
    }
    .stats-box.green {
      background: linear-gradient(135deg, #F0F8F6, #F2F8F0);
      border-color: var(--success);
      box-shadow: 0 1px 2px rgba(0,28,36,0.10);
    }
    .stats-box.orange {
      background: linear-gradient(135deg, #FFF7E8, #FFF7E8);
      border-color: var(--orange);
      box-shadow: 0 1px 2px rgba(0,28,36,0.10);
    }
    .stats-box.dark-purple {
      background: linear-gradient(135deg, #F2F8FD, #F2F8FD);
      border-color: var(--dark-purple);
      box-shadow: 0 1px 2px rgba(0,28,36,0.10);
    }
    .stats-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }
    .stats-value {
      font-size: 1.8rem;
      font-weight: 700;
      background: none;
      -webkit-background-clip: border-box;
      -webkit-text-fill-color: currentColor;
      line-height: 1.2;
    }
    .stats-value.large { font-size: 2rem; }
    .stats-value.success {
      background: none;
      -webkit-background-clip: border-box;
      -webkit-text-fill-color: currentColor;
    }
    .stats-value.warning {
      background: none;
      -webkit-background-clip: border-box;
      -webkit-text-fill-color: currentColor;
    }
    .stats-value.error {
      background: none;
      -webkit-background-clip: border-box;
      -webkit-text-fill-color: currentColor;
    }
    .stats-value.orange-grad {
      background: none;
      -webkit-background-clip: border-box;
      -webkit-text-fill-color: currentColor;
    }
    .stats-value.dark-purple-grad {
      background: none;
      -webkit-background-clip: border-box;
      -webkit-text-fill-color: currentColor;
    }
    .card {
      background: var(--card);
      border-radius: 4px;
      border: 1px solid var(--border);
      padding: 1.8rem 2rem;
      box-shadow: 0 1px 2px rgba(0,28,36,0.10);
    }
    #chartContainer {
      height: 520px;
      position: relative;
      margin-top: 1.5rem;
    }

    /* ── Aborts Table ── */
    #abortsContainer {
      display: none;
      margin-top: 1.5rem;
    }
    .abort-filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .abort-filter-label {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-weight: 600;
    }
    .abort-date-range {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .abort-date-input {
      padding: 0.55rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.85rem;
    }
    .abort-date-input:focus { outline: none; border-color: var(--orange); }
    .abort-load-btn {
      padding: 0.55rem 1rem;
      background: var(--orange);
      border: none;
      border-radius: 4px;
      color: #161E2D;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .abort-load-btn:hover { opacity: 0.85; }

    .loading, .error-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 1.2rem;
      background: #FFFFFF;
      border-radius: 4px;
      text-align: center;
      padding: 2rem;
      z-index: 10;
    }
    .error-msg { color: var(--error) !important; font-weight: 500; }

    @media (max-width: 1100px) {
      body { grid-template-columns: 1fr; }
      aside { height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); }
      main { padding: 2rem 1.5rem; }
      header { flex-direction: column; align-items: flex-start; }
      .stats-container { width: 100%; }
    }
  </style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="catalistics-shell.js" defer></script>
</head>
<body>

<aside>
  <div class="logo">Meters</div>

  <div class="view-toggle">
    <button class="view-tab tab-mix active" data-view="mix">📊 Meters &amp; Completion</button>
    <button class="view-tab tab-types" data-view="types">⚡ Install Types</button>
    <button class="view-tab tab-abort" data-view="aborts">🚫 Aborts</button>
  </div>

  <div id="periodSection">
    <h2>Time Period</h2>
    <div style="display: flex; gap: 0.5rem; margin: 0.4rem 0;">
      <button class="period-btn active" data-period="5days" style="margin: 0; flex: 1;">5 Days</button>
      <input type="date" id="wcDate" class="abort-date-input" style="flex: 1;" title="Week Commencing Date">
    </div>
    <button class="period-btn" data-period="4weeks">4 week rolling (bar)</button>
    <button class="period-btn" data-period="6months">6 months (line)</button>
    <button class="period-btn" data-period="year">Year to date (line)</button>
  </div>

  <h2>Team Leader</h2>
  <button class="team-btn active" data-team="all">All Teams <span class="headcount-badge" id="hc_all">…</span></button>
  <button class="team-btn" data-team="Team Leader 1">Team Leader 1 <span class="headcount-badge" id="hc_tl1">…</span></button>
  <button class="team-btn" data-team="Team Leader 2">Team Leader 2 <span class="headcount-badge" id="hc_tl2">…</span></button>
  <button class="team-btn" data-team="Team Leader 3">Team Leader 3 <span class="headcount-badge" id="hc_tl3">…</span></button>
  <button class="team-btn" data-team="Team Leader 4">Team Leader 4 <span class="headcount-badge" id="hc_tl4">…</span></button>

  <div id="monthSection">
    <h2>2026 Monthly View</h2>
    <div class="months-grid">
      <button class="month-btn" data-month="2026-01">Jan</button>
      <button class="month-btn" data-month="2026-02">Feb</button>
      <button class="month-btn" data-month="2026-03">Mar</button>
      <button class="month-btn" data-month="2026-04">Apr</button>
      <button class="month-btn" data-month="2026-05">May</button>
      <button class="month-btn" data-month="2026-06">Jun</button>
      <button class="month-btn" data-month="2026-07">Jul</button>
      <button class="month-btn" data-month="2026-08">Aug</button>
      <button class="month-btn" data-month="2026-09">Sep</button>
      <button class="month-btn" data-month="2026-10">Oct</button>
      <button class="month-btn" data-month="2026-11">Nov</button>
      <button class="month-btn" data-month="2026-12">Dec</button>
    </div>
  </div>
</aside>

<main>
  <header>
    <h1 id="pageTitle">Meters Installed</h1>
    <div class="stats-container" id="statsContainer">
    </div>
  </header>

  <div class="card">
    <div id="chartContainer">
      <div class="loading">Loading performance data…</div>
    </div>
    <div id="abortsContainer">
      <div class="abort-filters">
        <span class="abort-filter-label">Date range:</span>
        <div class="abort-date-range">
          <input type="date" class="abort-date-input" id="abortFrom">

          <input type="date" class="abort-date-input" id="abortTo">
        </div>
        <button class="abort-load-btn" id="abortLoadBtn">Load</button>
      </div>
      <div id="abortsChartContainer" style="height:480px;position:relative;margin-top:1rem;">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim)">Select a date range and click Load.</div>
      </div>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const perfConfig = CATALISTICS.firebaseConfig('primary');
  const existingApps = getApps();
  const perfApp = existingApps.find(a=>a.name==='perf-graph') || initializeApp(perfConfig, 'perf-graph');
  const db      = getFirestore(perfApp);

  const normTeam = val => {
    const v = (val || '').trim();
    if (/^ftl\s*4$/i.test(v)) return 'Team Leader 4';
    if (/^team leader 2\b/i.test(v)) return 'Team Leader 2';
    return v;
  };

  const ctx = document.createElement('canvas');
  document.querySelector('#chartContainer').appendChild(ctx);
  let chart = null;

  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  const periods = {
    "5days":   { label: "5 Days",         daysBack: 4,   color: "#3759CE", type: "bar"  },
    "4weeks":  { label: "4 week rolling", daysBack: 28,  color: "#8456CE", type: "bar"  },
    "6months": { label: "Last 6 months",  daysBack: 180, color: "#8456CE", type: "line" },
    "year":    { label: "Year to date",   daysBack: 365, color: "#8456CE", type: "line" },
  };

  let currentView   = "mix";
  let currentPeriod = "5days";
  let currentTeam   = "all";
  let currentMonth  = null;

  // Cache for headcount data fetched per date range
  let _hcBadgeLoaded = false;

  // ── Load headcount badge values from Morning Work for the sidebar ──────────────
  // We show the most-recent available day's values as a badge approximation.
  async function loadHeadcount() {
    try {
      // Use a recent window (last 7 days) to get the latest known headcount
      const refEnd = toLocalIsoString(today);
      const refStart = toLocalIsoString(new Date(today.getFullYear(), today.getMonth(), today.getDate() - 7));

      // Fetch Morning Work Headcount for All Teams badge
      const qHc = query(collection(db, "Morning Work Headcount"),
        where("date", ">=", refStart), where("date", "<=", refEnd));
      const snapHc = await getDocs(qHc);
      let latestHcDate = '';
      let latestHcVal  = 0;
      snapHc.forEach(d => {
        const data = d.data();
        if (data.date > latestHcDate) { latestHcDate = data.date; latestHcVal = Number(data.headcount || 0); }
      });
      if (latestHcVal > 0) document.getElementById('hc_all').textContent = latestHcVal;
      else document.getElementById('hc_all').textContent = '—';

      // Fetch Morning Work individual records for team badges
      const qKr = query(collection(db, "Morning Work"),
        where("date", ">=", refStart), where("date", "<=", refEnd));
      const snapKr = await getDocs(qKr);

      // Group by date and team to find the most recent day's per-team start headcount
      const dateTeamEngs = {};
      snapKr.forEach(d => {
        const rec = d.data();
        const t   = normTeam(rec.team || rec.teamLeader || '');
        const dt  = rec.date || '';
        const eng = (rec.engineer || '').trim();
        if (!eng || !dt) return;
        if (!dateTeamEngs[dt]) dateTeamEngs[dt] = {};
        if (!dateTeamEngs[dt][t]) dateTeamEngs[dt][t] = new Set();
        dateTeamEngs[dt][t].add(eng);
      });

      // Pick the most recent date that has Morning Work data
      const latestKrDate = Object.keys(dateTeamEngs).sort().pop() || '';
      if (latestKrDate) {
        const dtm = dateTeamEngs[latestKrDate];
        const countTeam = (tName) => dtm[tName] ? dtm[tName].size : 0;

        document.getElementById('hc_tl1').textContent   = countTeam('Team Leader 1') || '—';
        document.getElementById('hc_tl2').textContent     = countTeam('Team Leader 2') || '—';
        document.getElementById('hc_tl3').textContent    = countTeam('Team Leader 3') || '—';
        document.getElementById('hc_tl4').textContent       = countTeam('Team Leader 4') || '—';
      }

      _hcBadgeLoaded = true;
    } catch (err) {
      console.warn('Could not load dynamic headcount badges:', err);
      _hcBadgeLoaded = true;
    }
  }

  // ── Fetch attendance data (Sick + AAUP) for a date range and team ───────────
  // Returns: { [date]: count_of_sick_aaup_for_that_team }
  async function fetchAttendanceAbsences(startDate, endDate, team) {
    try {
      const q = query(
        collection(db, "attendance"),
        where("date", ">=", startDate),
        where("date", "<=", endDate)
      );
      const snap = await getDocs(q);
      const absences = {}; // date -> count
      snap.forEach(d => {
        const rec = d.data();
        if (rec.attendance !== 'Sick' && rec.attendance !== 'AAUP') return;
        const tl = normTeam((rec.teamLeader || '').trim());
        // Filter by team
        if (team !== 'all' && tl !== team) return;
        const dt = rec.date;
        absences[dt] = (absences[dt] || 0) + 1;
      });
      return absences;
    } catch (err) {
      console.warn('Could not fetch attendance absences:', err);
      return {};
    }
  }

  // ── Compute per-date START headcount from Morning Work records ──────────────────
  // For individual teams: count distinct engineers with ≥1 job on that date.
  // Returns: { [date]: startHeadcount }
  function computeStartHeadcounts(morningWorkRawRecords, team, morningWorkHcByDate) {
    if (team === 'all') {
      // Use the official Morning Work Headcount collection value
      return morningWorkHcByDate; // already keyed by date
    }
    // Build date -> set of engineers
    const dateEngs = {};
    morningWorkRawRecords.forEach(rec => {
      const t   = normTeam(rec.team || rec.teamLeader || '');
      const eng = (rec.engineer || '').trim();
      const dt  = rec.date || '';
      if (!eng || !dt || Number(rec.totalJobs || 0) < 1) return; // only engineers with ≥1 job

      const belongs = (t === team);
      if (!belongs) return;
      if (!dateEngs[dt]) dateEngs[dt] = new Set();
      dateEngs[dt].add(eng);
    });
    const result = {};
    Object.entries(dateEngs).forEach(([dt, s]) => { result[dt] = s.size; });
    return result;
  }

  // ── Helpers ───────────────────────────────────────────────────────────────────

  // HELPER: Convert date to YYYY-MM-DD in LOCAL time (ignores UTC shift)
  function toLocalIsoString(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  let abortChart = null;
  const today = new Date();
  const sevenAgo = new Date(today); sevenAgo.setDate(today.getDate() - 7);
  document.getElementById('abortFrom').value = toLocalIsoString(sevenAgo);
  document.getElementById('abortTo').value   = toLocalIsoString(today);

  async function fetchRecordsForRange(startDate, endDate, team) {
    const q = query(
      collection(db, "performance"),
      where("date", ">=", startDate),
      where("date", "<=", endDate),
      orderBy("date", "asc")
    );
    const snap = await getDocs(q);
    const recs = [];
    snap.forEach(doc => {
      const d = doc.data();
      const normalisedTeam = normTeam(d.teamLeader);
      if (team === "all" || normalisedTeam === team) recs.push({ ...d, teamLeader: normalisedTeam });
    });
    return recs;
  }

  async function fetchMorningWorkMphData(startDate, endDate, team) {
    try {
      const qMeters = query(collection(db, "Morning Work"), where("date", ">=", startDate), where("date", "<=", endDate));
      const snapMeters = await getDocs(qMeters);
      const morningWorkMeters  = {};
      const morningWorkRawRecs = []; // all raw records for headcount computation

      snapMeters.forEach(doc => {
        const d = doc.data();
        const rawTeam = d.team || d.teamLeader || '';
        const t = normTeam(rawTeam);
        morningWorkRawRecs.push({ ...d, _normTeam: t });
        // Accumulate meters
        if (team === "all" || t === team) {
          morningWorkMeters[d.date] = (morningWorkMeters[d.date] || 0) + Number(d.totalMeters || 0);
        }
      });

      // Fetch official all-team headcount from Morning Work Headcount collection
      const qHc = query(collection(db, "Morning Work Headcount"), where("date", ">=", startDate), where("date", "<=", endDate));
      const snapHc = await getDocs(qHc);
      const morningWorkHcOfficial = {}; // date -> total headcount (from morningwork.html entry)
      snapHc.forEach(doc => {
        const d = doc.data();
        morningWorkHcOfficial[d.date] = Number(d.headcount || 0);
      });

      // Compute per-date start headcount per team from Morning Work records
      const startHcByDate = computeStartHeadcounts(morningWorkRawRecs, team, morningWorkHcOfficial);

      // Fetch attendance absences (Sick + AAUP) for the same date range and team
      const absencesByDate = await fetchAttendanceAbsences(startDate, endDate, team);

      // Compute end headcount = start - absences
      const endHcByDate = {};
      const allDates = new Set([
        ...Object.keys(startHcByDate),
        ...Object.keys(absencesByDate)
      ]);
      allDates.forEach(dt => {
        const start = startHcByDate[dt] || 0;
        const absent = absencesByDate[dt] || 0;
        endHcByDate[dt] = Math.max(0, start - absent);
      });

      return { morningWorkMeters, morningWorkHc: morningWorkHcOfficial, startHcByDate, endHcByDate };
    } catch (err) {
      console.warn("Could not fetch Morning Work specific data:", err);
      return { morningWorkMeters: {}, morningWorkHc: {}, startHcByDate: {}, endHcByDate: {} };
    }
  }

  // Calculate Start MPH: meters / startHcByDate[date] (or morningWorkHc for all-teams)
  function computeStartMphForDate(meters, date, morningWorkHc, startHcByDate, team) {
    const m = meters || 0;
    if (m <= 0) return null;
    let hc;
    if (team === 'all') {
      hc = (morningWorkHc[date] && morningWorkHc[date] > 0) ? morningWorkHc[date] : 0;
    } else {
      hc = (startHcByDate[date] && startHcByDate[date] > 0) ? startHcByDate[date] : 0;
    }
    return hc > 0 ? Number((m / hc).toFixed(1)) : null;
  }

  // Calculate End MPH: meters / endHcByDate[date] (start - sick/AAUP absences)
  function computeEndMphForDate(meters, date, endHcByDate) {
    const m = meters || 0;
    if (m <= 0) return null;
    const hc = (endHcByDate[date] && endHcByDate[date] > 0) ? endHcByDate[date] : 0;
    return hc > 0 ? Number((m / hc).toFixed(1)) : null;
  }

  function getWeekdayDates(start, end) {
    const dates = [];
    const cur = new Date(start);
    while (cur <= end) {
      const dow = cur.getDay();
      if (dow !== 0 && dow !== 6) dates.push(toLocalIsoString(cur));
      cur.setDate(cur.getDate() + 1);
    }
    return dates;
  }

  function formatDayLabel(dateStr, multiLine) {
    // FIXED: Ensure strict local time parsing to prevent midnight UTC rollback
    const d = new Date(dateStr + 'T00:00:00'); 
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const weekday = d.toLocaleDateString('en-GB', { weekday: 'short' });
    return multiLine ? [`${dd}/${mm}`, weekday] : `${dd}/${mm}`;
  }

    document.getElementById('statsContainer').innerHTML = html;

  // ── VIEW: Meters + Completion (mix) ──────────────────────────────────────────

  async function fetchMonthDataMix(monthKey, team) {
    const [year, mon] = monthKey.split('-').map(Number);
    const startOfMonth = new Date(year, mon-1, 1);
    const endOfMonth   = new Date(year, mon, 0);
    const effectiveEnd = endOfMonth < today ? endOfMonth : today;
    
    const startDate = toLocalIsoString(startOfMonth);
    const endDate   = toLocalIsoString(effectiveEnd);

    const records = await fetchRecordsForRange(startDate, endDate, team);
    const { morningWorkMeters, morningWorkHc, startHcByDate, endHcByDate } = await fetchMorningWorkMphData(startDate, endDate, team);

    const weekdays  = getWeekdayDates(startOfMonth, effectiveEnd);
    const dateMap   = {};
    weekdays.forEach(d => dateMap[d] = { meters:0, completed:0, jobs:0 });

    records.forEach(r => {
      if (dateMap[r.date] !== undefined) {
        dateMap[r.date].meters    += Number(r.meters||0);
        dateMap[r.date].completed += Number(r.completed||0);
        dateMap[r.date].jobs      += Number(r.jobs||0);
      }
    });

    // Calculate Start MPH (Morning Work Meters / start headcount from Morning Work records)
    const startMphValues = weekdays.map(d => computeStartMphForDate(morningWorkMeters[d], d, morningWorkHc, startHcByDate, team));
    // Calculate End MPH (Meters Installed / end headcount = start - sick/AAUP)
    const endMphValues = weekdays.map(d => computeEndMphForDate(dateMap[d].meters, d, endHcByDate));

    return {
      rawDates: weekdays,
      labels: weekdays.map(d => formatDayLabel(d, true)),
      metersValues: weekdays.map(d => Math.round(dateMap[d].meters)),
      morningWorkMetersPerDay: weekdays.map(d => Math.round(morningWorkMeters[d] || 0)),
      startMphValues,
      endMphValues
    };
  }

  async function fetchPeriodDataMix(periodKey, team) {
    const cfg = periods[periodKey];
    let start = new Date(today);
    let end = new Date(today);
    
    if (periodKey === "5days") {
      const wcInput = document.getElementById('wcDate');
      if (wcInput && wcInput.value) {
        start = new Date(wcInput.value);
        end = new Date(start);
        end.setDate(end.getDate() + 4);
      } else {
        start.setDate(today.getDate() - cfg.daysBack);
      }
    } else {
      start.setDate(today.getDate() - cfg.daysBack);
    }
    
    const startDate = toLocalIsoString(start);
    const endDate = toLocalIsoString(end);

    const records = await fetchRecordsForRange(startDate, endDate, team);
    const { morningWorkMeters, morningWorkHc, startHcByDate, endHcByDate } = await fetchMorningWorkMphData(startDate, endDate, team);

    const weekdays = getWeekdayDates(start, end);
    const dateMap  = {};
    weekdays.forEach(d => dateMap[d] = 0);
    records.forEach(r => { if (dateMap[r.date]!==undefined) dateMap[r.date] += Number(r.meters||0); });

    // Calculate Start MPH (Morning Work Meters / start headcount from Morning Work records)
    const startMphValues = weekdays.map(d => computeStartMphForDate(morningWorkMeters[d], d, morningWorkHc, startHcByDate, team));
    // Calculate End MPH (Meters Installed / end headcount = start - sick/AAUP)
    const endMphValues = weekdays.map(d => computeEndMphForDate(dateMap[d]||0, d, endHcByDate));

    const isBar = cfg.type === 'bar';
    return {
      rawDates: weekdays,
      labels: weekdays.map(d => formatDayLabel(d, isBar)),
      values: weekdays.map(d => Math.round(dateMap[d]||0)),
      morningWorkMetersPerDay: weekdays.map(d => Math.round(morningWorkMeters[d] || 0)),
      workingDays: weekdays.length,
      startMphValues,
      endMphValues
    };
  }

  // Passing rawDates array to add click drill-down
  function dualAxisOptions(title, rawDates) {
    const scales = {
      x: { ticks:{ color:'#687078', font:{size:10}, padding:8 }, grid:{color:'#232F3E'} },
      yMeters: { type:'linear', position:'left', beginAtZero:true, grace:'20%', ticks:{ color:'#687078', stepSize:50 }, grid:{color:'#232F3E'}, title:{ display:true, text:'Meters Installed', color:'#3759CE', font:{size:12,weight:'600'} } },
      yMph: { type:'linear', position:'right', beginAtZero:true, suggestedMax: 10, grace:'20%', ticks:{ color:'#8456CE', stepSize:2 }, grid:{ drawOnChartArea:false }, title:{ display:true, text:'MPH', color:'#8456CE', font:{size:12,weight:'600'} } }
    };

    return {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode:'index', intersect:false },
      
      // DRILL DOWN ON CLICK EVENT
      onClick: (event, elements) => {
        if (elements.length > 0 && rawDates) {
          const index = elements[0].index;
          const clickedDateStr = rawDates[index]; // e.g., "2026-05-14"
          if (clickedDateStr) {
            const monthKey = clickedDateStr.substring(0, 7); // Extracts "2026-05"
            const targetBtn = document.querySelector(`.month-btn[data-month="${monthKey}"]`);
            if (targetBtn && !targetBtn.classList.contains('active')) {
              targetBtn.click(); // Triggers the sidebar button logic naturally
            }
          }
        }
      },
      // POINTER CURSOR ON HOVER
      onHover: (event, elements) => {
        const target = event.native ? event.native.target : event.target;
        target.style.cursor = elements.length ? 'pointer' : 'default';
      },

      plugins: {
        title: { display:true, text:title, color:'#879596', font:{size:17,weight:'600'}, padding:{bottom:20} },
        legend: { labels:{ color:'#879596', font:{size:13}, usePointStyle:true } },
        tooltip: {
          callbacks: {
            label: c => {
              if (c.dataset.label === 'Start MPH') return c.raw !== null ? ` Start MPH: ${c.raw}` : ' Start MPH: No data';
              if (c.dataset.label === 'End MPH') return c.raw !== null ? ` End MPH: ${c.raw}` : ' End MPH: No data';
              if (c.dataset.label === 'Morning Work Meters') return c.raw > 0 ? ` Morning Work Meters: ${c.raw}` : '';
              return ` Meters: ${c.raw}`;
            }
          }
        }
      },
      scales: scales
    };
  }

  async function fetchTypesData(periodKey, monthKey, team) {
    let startDate, endDate, weekdays, label, isBar;

    if (monthKey) {
      const [year, mon] = monthKey.split('-').map(Number);
      const startOfMonth = new Date(year, mon-1, 1);
      const endOfMonth   = new Date(year, mon, 0);
      const effectiveEnd = endOfMonth < today ? endOfMonth : today;
      
      startDate = toLocalIsoString(startOfMonth);
      endDate   = toLocalIsoString(effectiveEnd);
      
      weekdays  = getWeekdayDates(startOfMonth, effectiveEnd);
      label     = `${monthNames[mon-1]} ${year}`;
      isBar     = true;
    } else {
      const cfg  = periods[periodKey];
      let start = new Date(today);
      let end = new Date(today);
      
      if (periodKey === "5days") {
        const wcInput = document.getElementById('wcDate');
        if (wcInput && wcInput.value) {
          start = new Date(wcInput.value);
          end = new Date(start);
          end.setDate(end.getDate() + 4);
          label = `WC ${wcInput.value} (5 Days)`;
        } else {
          start.setDate(today.getDate() - cfg.daysBack);
          label = cfg.label;
        }
      } else {
        start.setDate(today.getDate() - cfg.daysBack);
        label = cfg.label;
      }
      
      startDate  = toLocalIsoString(start);
      endDate    = toLocalIsoString(end);
      
      weekdays   = getWeekdayDates(start, end);
      isBar      = cfg.type === 'bar';
    }

    const records = await fetchRecordsForRange(startDate, endDate, "all");
    const dateMap = {};
    weekdays.forEach(d => dateMap[d] = { duals:0, singles:0, comms:0 });
    records.forEach(r => {
      if (dateMap[r.date] !== undefined) {
        dateMap[r.date].duals   += Number(r.duals||0);
        dateMap[r.date].singles += Number(r.singles||0);
        dateMap[r.date].comms   += Number(r.comms||0);
      }
    });

    return {
      rawDates: weekdays,
      labels:  weekdays.map(d => formatDayLabel(d, isBar)),
      duals:  weekdays.map(d => dateMap[d].duals),
      singles: weekdays.map(d => dateMap[d].singles),
      comms:   weekdays.map(d => dateMap[d].comms),
      label, isBar
    };
  }

      data: {

            backgroundColor: chartType==='bar' ? 'rgba(6,127,104,0.75)' : 'rgba(6,127,104,0.15)',
            borderColor: '#2EA597', borderWidth: chartType==='bar'?1:3,
            borderRadius: chartType==='bar'?6:0, tension:0.35, fill: chartType==='line',
            pointRadius: chartType==='bar'?0:3, pointHoverRadius:7,
            datalabels: chartType==='bar' ? {
              anchor:'end', align:'top', offset:2, color:'#879596', font:{weight:'bold',size:10},
              formatter: v => v>0?v:'', textShadowColor:'rgba(0,0,0,0.8)', textShadowBlur:4
            } : { display: false }
          },
          {
            label: 'Singles', data: data.singles,
            backgroundColor: chartType==='bar' ? 'rgba(9,114,211,0.75)' : 'rgba(9,114,211,0.15)',
            borderColor: '#3759CE', borderWidth: chartType==='bar'?1:3,
            borderRadius: chartType==='bar'?6:0, tension:0.35, fill: chartType==='line',
            pointRadius: chartType==='bar'?0:3, pointHoverRadius:7,
            datalabels: chartType==='bar' ? {
              anchor:'end', align:'top', offset:2, color:'#879596', font:{weight:'bold',size:10},
              formatter: v => v>0?v:'', textShadowColor:'rgba(0,0,0,0.8)', textShadowBlur:4
            } : { display: false }
          },
          {
            label: 'Comms/Site Visits', data: data.comms,
            backgroundColor: chartType==='bar' ? 'rgba(236,114,17,0.75)' : 'rgba(236,114,17,0.15)',
            borderColor: '#FF9900', borderWidth: chartType==='bar'?1:3,
            borderRadius: chartType==='bar'?6:0, tension:0.35, fill: chartType==='line',
            pointRadius: chartType==='bar'?0:3, pointHoverRadius:7,
            datalabels: chartType==='bar' ? {
              anchor:'end', align:'top', offset:2, color:'#879596', font:{weight:'bold',size:10},
              formatter: v => v>0?v:'', textShadowColor:'rgba(0,0,0,0.8)', textShadowBlur:4
            } : { display: false }
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode:'index', intersect:false },
        
        // DRILL DOWN ON CLICK EVENT
        onClick: (event, elements) => {
          if (elements.length > 0 && data.rawDates) {
            const index = elements[0].index;
            const clickedDateStr = data.rawDates[index];
            if (clickedDateStr) {
              const monthKey = clickedDateStr.substring(0, 7); // Extracts "2026-05"
              const targetBtn = document.querySelector(`.month-btn[data-month="${monthKey}"]`);
              if (targetBtn && !targetBtn.classList.contains('active')) {
                targetBtn.click();
              }
            }
          }
        },
        // POINTER CURSOR ON HOVER
        onHover: (event, elements) => {
          const target = event.native ? event.native.target : event.target;
          target.style.cursor = elements.length ? 'pointer' : 'default';
        },

        plugins: {
          title: { display:true, text:`${data.label} – Install Types (All Teams)`, color:'#879596', font:{size:18,weight:'600'}, padding:{bottom:20} },
          legend: { labels:{ color:'#879596', font:{size:14} } }
        },
        scales: {
          x: { ticks:{ color:'#687078', font:{size:chartType==='bar'?11:12}, padding:8 }, grid:{color:'#232F3E'} },
          y: { beginAtZero:true, ticks:{ color:'#687078', stepSize:5 }, grid:{color:'#232F3E'} }
        }
      },
      plugins: [ChartDataLabels]
    });
  }

  // ── VIEW: Aborts ──────────────────────────────────────────────────────────────

  const ABORT_REASONS = [
    'Tech abort','No access','Refused access','Higher skill set required',
    'Work not required','DNO Issue','Stock issue','Wrong details',
    'H&S issue','No abort code','Customer Cancellation','Left open',
  ];

  function normaliseReason(raw) {
    if (!raw) return ['No abort code'];
    const str = raw.trim();
    const multMatch = str.match(/^(.+?)\s*[xX×](\d+)\s*$/);
    let baseStr = str, multiplier = 1;
    if (multMatch) { baseStr = multMatch[1].trim(); multiplier = parseInt(multMatch[2]) || 1; }
    const parts = baseStr.split(',').map(p => p.trim()).filter(Boolean);
    const results = [];
    parts.forEach(part => { const matched = fuzzyMatchReason(part); for (let i=0;i<multiplier;i++) results.push(matched); });
    return results;
  }

  function fuzzyMatchReason(str) {
    const s = str.toLowerCase().replace(/[^a-z0-9 &]/g,'').trim();
    const map = {
      'tech abort':'Tech abort','technical abort':'Tech abort',
      'no access':'No access','refused access':'Refused access','refused':'Refused access',
      'higher skill set required':'Higher skill set required','higher skill':'Higher skill set required','skill set':'Higher skill set required',
      'work not required':'Work not required','not required':'Work not required',
      'dno issue':'DNO Issue','dno':'DNO Issue',
      'stock issue':'Stock issue','stock':'Stock issue',
      'wrong details':'Wrong details','wrong detail':'Wrong details',
      'hs issue':'H&S issue','h&s issue':'H&S issue','h&s':'H&S issue','health and safety':'H&S issue',
      'no abort code':'No abort code','no code':'No abort code',
      'customer cancellation':'Customer Cancellation','customer cancel':'Customer Cancellation','cancellation':'Customer Cancellation',
      'left open':'Left open',
    };
    if (map[s]) return map[s];
    for (const [key,val] of Object.entries(map)) { if (s.includes(key)||key.includes(s)) return val; }
    for (const canon of ABORT_REASONS) { if (s.includes(canon.toLowerCase())||canon.toLowerCase().includes(s)) return canon; }
    return 'No abort code';
  }

  async function loadAborts() {
    const fromDate = document.getElementById('abortFrom').value;
    const toDate   = document.getElementById('abortTo').value;
    if (!fromDate || !toDate) return;

    const abortsChartEl = document.getElementById('abortsChartContainer');
    abortsChartEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:1.1rem">Loading…</div>';

    try {
      const q = query(collection(db,"aborts"),where("date",">=",fromDate),where("date","<=",toDate),orderBy("date","asc"));
      const snap = await getDocs(q);
      const allAborts = [];
      snap.forEach(doc => { const d = doc.data(); allAborts.push({...d, teamLeader: normTeam(d.teamLeader)}); });

      const filtered = currentTeam==='all' ? allAborts : allAborts.filter(r=>r.teamLeader===currentTeam);

      if (filtered.length === 0) {
        abortsChartEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:1.1rem">No abort records found for this period.</div>';
        setStats(`<div class="stats-box orange"><div class="stats-label">Total Aborts</div><div class="stats-value orange-grad large">0</div></div>`);
        return;
      }

      const reasonTotals = {};
      ABORT_REASONS.forEach(r => reasonTotals[r] = 0);
      filtered.forEach(row => {
        const rawTotal = Number(row.total)||1;
        const resolved = normaliseReason(row.reason||'');
        const share = rawTotal/resolved.length;
        resolved.forEach(canon => { reasonTotals[canon] = (reasonTotals[canon]||0) + share; });
      });
      ABORT_REASONS.forEach(r => { reasonTotals[r] = Math.round(reasonTotals[r]); });

      const grandTotal = ABORT_REASONS.reduce((s,r)=>s+reasonTotals[r],0);
      const topReason  = ABORT_REASONS.slice().sort((a,b)=>reasonTotals[b]-reasonTotals[a])[0];
      const uniqueEng  = new Set(filtered.map(r=>r.engineer)).size;

      setStats(
        `<div class="stats-box orange"><div class="stats-label">Total Aborts</div><div class="stats-value orange-grad large">${grandTotal}</div></div>` +
        `<div class="stats-box"><div class="stats-label">Engineers</div><div class="stats-value">${uniqueEng}</div></div>` +
        `<div class="stats-box" style="min-width:200px"><div class="stats-label">Top Reason</div><div class="stats-value orange-grad" style="font-size:1rem;line-height:1.3;padding-top:2px">${topReason}</div></div>`
      );

      abortsChartEl.innerHTML = '';
      const abortCtx = document.createElement('canvas');
      abortsChartEl.appendChild(abortCtx);
      if (abortChart) abortChart.destroy();

      const chartData = ABORT_REASONS.map(r => reasonTotals[r]);
      abortChart = new Chart(abortCtx, {
        type: 'bar',
        data: {
          labels: ABORT_REASONS,
          datasets: [{
            label: 'Aborts', data: chartData,
            backgroundColor: chartData.map(v => v===Math.max(...chartData)?'rgba(209,50,18,0.8)':'rgba(236,114,17,0.75)'),
            borderColor: chartData.map(v => v===Math.max(...chartData)?'#D13212':'#EC7211'),
            borderWidth: 1, borderRadius: 5,
            datalabels: {
              display: true, anchor:'end', align:'top', offset:2, color:'#879596', font:{weight:'bold',size:12},
              formatter: v => v>0?v:'', textShadowColor:'rgba(0,0,0,0.8)', textShadowBlur:4
            }
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          layout: { padding:{ top:24 } },
          plugins: {
            title: { display:true, text:`Aborts by Reason — ${currentTeam==='all'?'All Teams':currentTeam} (${fromDate} → ${toDate})`, color:'#879596', font:{size:16,weight:'600'}, padding:{bottom:20} },
            legend: { display:false },
            tooltip: { callbacks:{ label: c=>` Total: ${c.raw}` } }
          },
          scales: {
            x: { ticks:{ color:'#687078', font:{size:11}, padding:4, maxRotation:90, minRotation:90, autoSkip:false }, grid:{color:'#232F3E'} },
            y: { beginAtZero:true, ticks:{ color:'#687078', precision:0 }, grid:{color:'#232F3E'} }
          }
        },
        plugins: [ChartDataLabels]
      });

    } catch (err) {
      console.error(err);
      document.getElementById('abortsChartContainer').innerHTML =
        `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--error);font-size:1rem">${err.message}</div>`;
    }
  }

  // ── Main render dispatcher ────────────────────────────────────────────────────

  async function updateView() {
    const chartContainer  = document.getElementById('chartContainer');
    const abortsContainer = document.getElementById('abortsContainer');
    const periodSection   = document.getElementById('periodSection');
    const monthSection    = document.getElementById('monthSection');

    if (currentView === 'aborts') {
      chartContainer.style.display  = 'none';
      abortsContainer.style.display = 'block';
      periodSection.style.display   = 'none';
      monthSection.style.display    = 'none';
      document.getElementById('pageTitle').textContent = 'Aborts Breakdown';
      await loadAborts();
    } else {
      chartContainer.style.display  = 'block';
      abortsContainer.style.display = 'none';
      periodSection.style.display   = 'block';
      monthSection.style.display    = 'block';
      chartContainer.innerHTML = '<div class="loading">Loading…</div>';
      chartContainer.appendChild(ctx);
      try {
        if (currentView === 'mix')   await renderMix();
        if (currentView === 'types') await renderTypes();
      } catch (err) {
        console.error(err);
        chartContainer.innerHTML = `<div class="error-msg">${err.message}<br><small>F12 → Console for details</small></div>`;
      }
    }
  }

  // ── Event listeners ───────────────────────────────────────────────────────────

  document.querySelectorAll('.view-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.view-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.dataset.view;
      updateView();
    });
  });

  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPeriod = btn.dataset.period;
      currentMonth  = null;
      
      if (currentPeriod !== '5days') {
        const wcInput = document.getElementById('wcDate');
        if (wcInput) wcInput.value = '';
      }
      
      updateView();
    });
  });

  const wcDateEl = document.getElementById('wcDate');
  if (wcDateEl) {
    wcDateEl.addEventListener('change', () => {
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
      const btn5 = document.querySelector('.period-btn[data-period="5days"]');
      if (btn5) btn5.classList.add('active');
      
      currentPeriod = "5days";
      currentMonth  = null;
      updateView();
    });
  }

  document.querySelectorAll('.team-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTeam = btn.dataset.team;
      updateView();
    });
  });

  document.querySelectorAll('.month-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMonth  = btn.dataset.month;
      currentPeriod = null;
      updateView();
    });
  });

  document.getElementById('abortLoadBtn').addEventListener('click', loadAborts);

  // ── Bootstrap ─────────────────────────────────────────────────────────────────
  loadHeadcount(); // non-blocking badge update
  updateView();
</script>
